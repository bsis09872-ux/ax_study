<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>팀스파르타</title>
    </head>
    <body>
        <h1>회원 가입</h1>
        <form method="POST" action="sign_up.html">
            이메일 <input type= "email" name="email" value="user01@mail.com" required><br>
            비밀번호 <input type= "password" name="password" required><br>
            비밀번호 확인 <input type= "password" name="password" required><br>
            회원이름 <input type= "text" name="username" required><br>
            성별
                <label>
                <input type="radio" name="gender" value="FEMALE" checked> 여성
                </label>
                <label>
                <input type="radio" name="gender" value="MALE"> 남성<br>
                </label>
            취미
                <input type="checkbox" id="hobby_python" name="hobby" value="python"> 
                <label for ="hobby_python"> 파이썬 공부 </label>
                <input type="checkbox" id="hobby_machine" name="hobby" value="machine">
                <label for ="hobby_machine"> 머신러닝 공부 </label>
                <input type="checkbox" id="hobby_reading" name="hobby" value="reading">
                <label for ="hobby_reading"> 독서 </label><br>

            자기소개 <textarea name="introduction" rows="5" cols="100" placeholder="2줄 이상 입력하시오 ..."></textarea><br>
            태어난 년도
            <select name="birth_year" multiple size="2">
                <option value = "2020">2020년</option>
                <option value = "2021">2021년</option>
                <option value = "2022">2022년</option>
                <option value = "2023" selected>2023년</option>
                <option value = "2024">2024년</option>
            </select><br>

            <!--<input type="submit" value="회원가입">-->
            <button type="submit"> 회원가입</button>
        </form>
    </body>
</html>
