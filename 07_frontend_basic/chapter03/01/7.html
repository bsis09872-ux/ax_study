<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .box {
            display: grid;
            background: #ccc;
            grid-template-columns: repeat(3,1fr);
            width: 600px;
            padding: 30px;
            gap: 15px;
            place-items: start;
        }

        .area {
            background: skyblue;
            height: 100px;
        }

        .area:nth-of-type(1) {
            grid-column: span 2;
        }

        .area:nth-of-type(2) {
            grid-row: span 2; 
        }

    </style>
    <div class="box">
        <div class="area"><span>A</span></div>
        <div class="area"><span>B</span></div>
        <div class="area"><span>C</span></div>
        <div class="area"><span>D</span></div>
    </div>
</body>
</html>
