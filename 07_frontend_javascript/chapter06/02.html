<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
    img {
    display: block;
    }

    .photo .image2 {
    display: none;
    }

    .photo.swap .image1 {
    display: none;
    }

    .photo.swap .image2 {
    display: block;
    }
</style>
<script>
    window.addEventListener("DOMContentLoaded", function() {
        const buttonE1 = document.getElementById("swap");
        console.log("buttonE1", buttonE1);
        buttonE1.addEventListener("click", function() {
            const photoE1 = document.querySelector(".photo");
            const classList = buttonE1.classList;
            console.log("classList", classList);
            if (classList.contains("swap")) {
                classList.remove("swap");
            } else {
                classList.add("swap");
            }
        });    
    });
</script>
<div class="photo">
    <img src="images/1.jpg" class="image1">
    <img src="images/1+on.jpg" class=""image2>
</div>
</body>
</html>
